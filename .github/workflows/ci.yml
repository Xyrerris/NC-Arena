name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, boundaries, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile is written by npm 11 and `npm ci` refuses a tree it would have
      # resolved differently. Node 22 ships npm 10, and the two majors disagree about the
      # optional peer dependencies of `@testing-library/react-hooks@8.0.1` — React 17 test
      # tooling that `@infinitered/react-native-mlkit-core` ships as a regular dependency,
      # four levels down. npm 10 wants `@types/react@17` and `react-dom@17` in the tree,
      # npm 11 leaves them out, so the lock has no entry for them and the sync check fails
      # on a lockfile that is not actually wrong. Pinning the major here is the fix that
      # does not make the lock churn every time a developer runs `npm install`.
      - name: Match the npm that writes the lockfile
        run: npm install -g npm@11

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The architectural gates: module boundaries (ARCHITECTURE.md §4) and design tokens
      # (§2.4, §2.2). A separate step from Lint on purpose — a clean `eslint .` proves
      # nothing about either rule, because a misconfigured rule reports zero violations and
      # looks identical to a compliant codebase. That is exactly what happened for two
      # phases (ADR-0006). This step writes deliberate violations and fails if they pass.
      - name: Architecture rules
        run: npm run check:rules

      - name: Format
        run: npm run format

      - name: Test
        run: npm test

      # Catches the Expo SDK version-mismatch class of failure, which otherwise only
      # surfaces at native build time and gets diagnosed by hand.
      - name: Expo doctor
        run: npx expo-doctor
# Not here yet, and deliberately so:
#
#   * EAS Build of the development profile — needs an EXPO_TOKEN repository secret and an
#     Expo account. Add the job when the account exists; the eas.json profiles are already
#     written.
#   * Maestro flows and screenshot diffs on an emulator — Phase 1 measures what that
#     costs before it is wired in as a PR gate (ARCHITECTURE.md §10).
