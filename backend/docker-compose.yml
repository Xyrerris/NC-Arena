# Deploys the three containers ADR-0035 describes on the OVH VPS: `db` (Postgres, the roster's
# storage), `app` (this Fastify service) and `caddy` (reverse proxy + automatic TLS). Run from
# this directory: `docker compose up -d`. `.env` next to this file supplies DATABASE_URL, the
# Postgres credentials and the domain Caddy requests a certificate for — copy `.env.example`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-arena_scout}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arena}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-arena}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-arena_scout}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
