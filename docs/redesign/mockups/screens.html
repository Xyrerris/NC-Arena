<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arena — screen mockups (Checkpoint 6)</title>
    <style>
      /* The bundled files, not system fonts: a silent fallback would invalidate every typographic judgement. */
      @font-face {
        font-family: 'Barlow';
        font-weight: 400;
        src: url('../../../assets/fonts/Barlow-Regular.ttf');
      }
      @font-face {
        font-family: 'Barlow';
        font-weight: 500;
        src: url('../../../assets/fonts/Barlow-Medium.ttf');
      }
      @font-face {
        font-family: 'Barlow';
        font-weight: 600;
        src: url('../../../assets/fonts/Barlow-SemiBold.ttf');
      }
      @font-face {
        font-family: 'Barlow';
        font-weight: 700;
        src: url('../../../assets/fonts/Barlow-Bold.ttf');
      }
      @font-face {
        font-family: 'Cinzel';
        font-weight: 500;
        src: url('../../../assets/fonts/Cinzel-Medium.ttf');
      }
      @font-face {
        font-family: 'Cinzel';
        font-weight: 700;
        src: url('../../../assets/fonts/Cinzel-Bold.ttf');
      }
      @font-face {
        font-family: 'JetBrainsMono';
        font-weight: 400;
        src: url('../../../assets/fonts/JetBrainsMono-Regular.ttf');
      }
      @font-face {
        font-family: 'JetBrainsMono';
        font-weight: 500;
        src: url('../../../assets/fonts/JetBrainsMono-Medium.ttf');
      }

      /* ===== Tokens: CHECKPOINT_5 §1, name for name. Nothing below this block writes a colour. ===== */
      :root {
        --fs: 1;
        --gutter: 22px;
        --body-font: 'Barlow', sans-serif;
        --display-font: 'Cinzel', serif;
        --num-font: 'JetBrainsMono', monospace;
      }
      [data-theme='dark'] {
        --background: #07100d;
        --surface: #0e1a16;
        --raised: #14241e;
        --text-primary: #ece6d8;
        --text-strong: #c3bfb3;
        --text-body: #a59f90;
        --text-muted: #9a998f;
        --text-subtle: #8c8c83;
        --accent: #5fd6a2;
        --accent-bright: #8ce6c1;
        --on-accent: #07100d;
        --negative: #e0705f;
        --warning: #e6b450;
        --info: #7fb6e8;
        --divider: rgba(236, 230, 216, 0.14);
        --border: rgba(236, 230, 216, 0.4);
        --fill: rgba(236, 230, 216, 0.07);
        --accent-wash: rgba(95, 214, 162, 0.16);
        --accent-wash-faint: rgba(95, 214, 162, 0.06);
        --scrim: rgba(0, 0, 0, 0.52);
      }
      [data-theme='light'] {
        --background: #f1eee6;
        --surface: #faf8f2;
        --raised: #ffffff;
        --text-primary: #14201b;
        --text-strong: #3c4540;
        --text-body: #5c6259;
        --text-muted: #646a64;
        --text-subtle: #646a64;
        --accent: #0f7a54;
        --accent-bright: #0b6141;
        --on-accent: #faf8f2;
        --negative: #b53d2c;
        --warning: #8a5a00;
        --info: #1f5f9e;
        --divider: rgba(20, 32, 27, 0.16);
        --border: rgba(20, 32, 27, 0.5);
        --fill: rgba(20, 32, 27, 0.07);
        --accent-wash: rgba(15, 122, 84, 0.16);
        --accent-wash-faint: rgba(15, 122, 84, 0.06);
        --scrim: rgba(0, 0, 0, 0.52);
      }

      /* ===== Page chrome (not part of the app) ===== */
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font:
          14px system-ui,
          sans-serif;
        background: #cfd3d1;
        color: #111;
        padding: 20px;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        align-items: center;
        background: #cfd3d1;
        padding: 8px 0 12px;
      }
      .toolbar .grp {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .toolbar b {
        font-size: 12px;
        margin-right: 4px;
      }
      .toolbar button {
        font: 600 13px system-ui;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid #777;
        background: #fff;
        cursor: pointer;
      }
      .toolbar button.on {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      #fontcheck {
        font: 12px system-ui;
      }
      h2.group {
        font: 700 16px system-ui;
        margin: 22px 0 10px;
      }
      .screens {
        display: flex;
        gap: 26px;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      figure {
        width: var(--w, 360px);
      }
      figcaption {
        font: 13px/1.4 system-ui;
        margin-top: 8px;
        color: #222;
        max-width: var(--w, 360px);
      }
      figcaption b {
        display: block;
      }

      /* ===== The phone: width is the dp width; text scales with --fs, spacing never does ===== */
      .phone {
        width: var(--w, 360px);
        height: 740px;
        position: relative;
        overflow: hidden;
        border-radius: 28px;
        border: 6px solid #000;
        background: var(--background);
        color: var(--text-primary);
        font-family: var(--body-font);
        display: flex;
        flex-direction: column;
      }
      .status {
        height: 28px;
        padding: 6px 18px 0;
        display: flex;
        justify-content: space-between;
        font: 600 12px system-ui;
        color: var(--text-body);
        flex: none;
      }
      .scroll {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: none;
        position: relative;
      }
      .barwrap {
        flex: none;
      }

      /* Type roles (CHECKPOINT_5 §2). Sizes are multiplied by --fs; leading is unitless. */
      .t-display {
        font: 700 calc(32px * var(--fs)) / 1.05 var(--display-font);
        color: var(--text-primary);
      }
      .t-heading {
        font: 700 calc(20px * var(--fs)) / 1.1 var(--display-font);
      }
      .t-rank {
        font: 500 calc(20px * var(--fs)) / 1 var(--display-font);
        color: var(--accent);
      }
      .t-sub {
        font: 600 calc(16px * var(--fs)) / 1.25 var(--body-font);
      }
      .t-body {
        font: 400 calc(14px * var(--fs)) / 1.65 var(--body-font);
        color: var(--text-body);
      }
      .t-caption {
        font: 400 calc(12px * var(--fs)) / 1.4 var(--body-font);
        color: var(--text-muted);
      }
      .t-label {
        font: 600 calc(12px * var(--fs)) / 1.2 var(--body-font);
      }
      .t-labelsm {
        font: 600 calc(11px * var(--fs)) / 1.2 var(--body-font);
      }
      .t-btn {
        font: 600 calc(15px * var(--fs)) / 1.2 var(--body-font);
      }
      .t-num-hero {
        font: 500 calc(22px * var(--fs)) / 1.1 var(--num-font);
      }
      .t-num {
        font: 500 calc(13px * var(--fs)) / 1.2 var(--num-font);
      }
      .t-num-sm {
        font: 400 calc(11.5px * var(--fs)) / 1.6 var(--num-font);
        color: var(--text-muted);
      }
      .accent {
        color: var(--accent);
      }
      .neg {
        color: var(--negative);
      }
      .muted {
        color: var(--text-muted);
      }
      .ico {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }

      /* ===== Components ===== */
      .gutter {
        padding-left: var(--gutter);
        padding-right: var(--gutter);
      }
      .titlerow {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding-top: 8px;
      }
      .season {
        font: 500 calc(11.5px * var(--fs)) / 1.2 var(--num-font);
        letter-spacing: 0.12em;
        color: var(--accent);
      }
      .sync {
        padding-top: 6px;
      }
      .sync.live {
        color: var(--accent);
      }
      .countrow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 4px 8px;
        padding-top: 10px;
      }
      .btn-quiet {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 48px;
        color: var(--accent);
        font: 600 calc(15px * var(--fs)) / 1.2 var(--body-font);
      }
      .btn-quiet .ico {
        width: 20px;
        height: 20px;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 8px;
        background: var(--accent);
        color: var(--on-accent);
        font: 600 calc(15px * var(--fs)) / 1.2 var(--body-font);
      }
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 8px;
        border: 1px solid var(--border);
        color: var(--text-primary);
        font: 600 calc(15px * var(--fs)) / 1.2 var(--body-font);
      }
      .field {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        color: var(--text-muted);
        font: 400 calc(14px * var(--fs)) / 1.2 var(--body-font);
        margin-top: 4px;
      }
      .chips {
        display: flex;
        gap: 0;
        overflow: hidden;
        padding-top: 2px;
      }
      /* A chip is a 48 dp pressable with the pill drawn inside it. */
      .chipbox {
        display: flex;
        align-items: center;
        min-height: 48px;
        padding-right: 8px;
        flex: none;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        padding: 0 14px;
        border-radius: 9999px;
        background: var(--fill);
        color: var(--text-strong);
        font: 600 calc(12px * var(--fs)) / 1.2 var(--body-font);
      }
      .chip.on {
        background: var(--accent-wash);
        color: var(--text-primary);
      }
      .chip.on .ico {
        color: var(--accent);
        width: 14px;
        height: 14px;
        stroke-width: 2.4;
      }

      .list {
        border-top: 1px solid var(--divider);
        margin-top: 4px;
      }
      /* Rank column is three digits' worth of the live text size: React Native has no em. */
      .row {
        display: grid;
        grid-template-columns: calc(2.1 * 20px * var(--fs)) 1fr auto;
        column-gap: 10px;
        align-items: center;
        min-height: 56px;
        padding: 14px var(--gutter);
        border-bottom: 1px solid var(--divider);
      }
      .row .rk {
        text-align: right;
      }
      .row .meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .row .trail {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }
      .row.me {
        background: var(--accent-wash-faint);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      /* Past 1.5x the row stacks: name, exact CP, then the trailing facts on their own line. */
      [data-stack='1'] .row {
        grid-template-columns: calc(2.1 * 20px * var(--fs)) 1fr;
        row-gap: 6px;
      }
      [data-stack='1'] .row .trail {
        grid-column: 2;
        align-items: flex-start;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      .rec {
        font: 500 calc(11.5px * var(--fs)) / 1.2 var(--num-font);
        white-space: nowrap;
      }
      .rec .w {
        color: var(--accent);
      }
      .rec .l {
        color: var(--negative);
      }
      .viewer {
        display: grid;
        grid-template-columns: calc(2.1 * 20px * var(--fs)) 1fr auto;
        column-gap: 10px;
        align-items: center;
        padding: 12px var(--gutter);
        background: var(--accent-wash-faint);
        box-shadow: inset 3px 0 0 var(--accent);
        margin-top: 10px;
        border-top: 1px solid var(--divider);
      }
      [data-stack='1'] .viewer {
        grid-template-columns: calc(2.1 * 20px * var(--fs)) 1fr;
        row-gap: 6px;
      }
      [data-stack='1'] .viewer .trail {
        grid-column: 2;
        align-items: flex-start;
      }
      .viewer .trail {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
      }
      .viewer-act {
        padding: 0 var(--gutter);
        border-bottom: 1px solid var(--divider);
        background: var(--accent-wash-faint);
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .banner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 4px 8px;
        padding: 6px var(--gutter);
      }
      .banner .t {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        flex: 1 1 60%;
        color: var(--negative);
      }
      .center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 var(--gutter);
        text-align: center;
      }
      .center .glyph {
        width: 48px;
        height: 48px;
        color: var(--text-muted);
        stroke-width: 1.5;
      }
      .skel {
        height: 14px;
        border-radius: 4px;
        background: var(--fill);
      }

      /* Bottom bar, Option 1: docked, no transition, divider on the top edge. */
      .bottombar {
        display: flex;
        border-top: 1px solid var(--divider);
        background: var(--surface);
        min-height: 56px;
      }
      .bottombar .tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 6px 0;
        color: var(--text-muted);
      }
      .bottombar .tab.on .ico {
        color: var(--accent);
      }
      .pill-on {
        display: inline-flex;
        padding: 3px 16px;
        border-radius: 9999px;
      }
      .tab.on .pill-on {
        background: var(--accent-wash);
      }
      .tab.on .t-labelsm {
        color: var(--text-primary);
      }
      .navbar-gap {
        height: 10px;
        flex: none;
        background: var(--surface);
      }

      /* ===== Pushed screens: top bar, no bottom bar ===== */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 56px;
        padding: 0 8px 0 4px;
        flex: none;
      }
      .iconbtn {
        width: 48px;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text-primary);
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--divider);
        margin-top: 8px;
      }
      .tabs .tb {
        flex: 1;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        font: 600 calc(12px * var(--fs)) / 1.2 var(--body-font);
      }
      .tabs .tb.on {
        color: var(--text-primary);
        border-bottom-color: var(--accent);
      }
      .stat {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 12px var(--gutter);
        border-bottom: 1px solid var(--divider);
        min-height: 48px;
      }
      .stat .nm {
        flex: 0 0 calc(48px * var(--fs));
      }
      .stat .ex {
        flex: 1;
        text-align: right;
      }
      .stat .sh {
        flex: 0 0 auto;
        text-align: right;
        min-width: calc(56px * var(--fs));
      }
      [data-stack='1'] .stat {
        flex-wrap: wrap;
      }
      .h2h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px var(--gutter);
        border-bottom: 1px solid var(--divider);
      }
      .step {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--gutter);
        min-height: 56px;
        border-bottom: 1px solid var(--divider);
      }
      .step .ctl {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .step .ctl .n {
        min-width: 32px;
        text-align: center;
      }
      .step .iconbtn.off {
        color: var(--text-subtle);
        opacity: 0.55;
      }
      .cmp {
        padding: 12px var(--gutter);
        border-bottom: 1px solid var(--divider);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .cmp .hd {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .cmp .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--fill);
        overflow: hidden;
      }
      .cmp .bar i {
        display: block;
        height: 100%;
      }
      .cmp .vals {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .ffield {
        padding: 0 var(--gutter);
        margin-top: 12px;
      }
      .ffield .lbl {
        display: block;
        margin-bottom: 4px;
        color: var(--text-strong);
      }
      .ffield .box {
        display: flex;
        align-items: center;
        min-height: 48px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        font: 400 calc(14px * var(--fs)) / 1.2 var(--body-font);
        color: var(--text-primary);
      }
      .ffield .box.num {
        font-family: var(--num-font);
      }
      .ffield .box.ph {
        color: var(--text-muted);
      }
      .ffield .box.focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent);
      }
      .ffield .box.err {
        border-color: var(--negative);
      }
      .ffield .help {
        display: flex;
        gap: 6px;
        margin-top: 4px;
        align-items: flex-start;
      }
      .ffield .help.err {
        color: var(--negative);
      }
      .sec {
        padding: 22px var(--gutter) 0;
        color: var(--text-strong);
      }
      .actions {
        padding: 22px var(--gutter) 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .actions .btn-primary {
        width: 100%;
      }
      .btn-danger {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        color: var(--negative);
        font: 600 calc(15px * var(--fs)) / 1.2 var(--body-font);
      }
      .stickybar {
        flex: none;
        padding: 10px var(--gutter);
        border-top: 1px solid var(--divider);
        background: var(--raised);
      }
      .stickybar .btn-primary {
        width: 100%;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: var(--scrim);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
      }
      .dialog {
        width: 100%;
        max-width: 560px;
        background: var(--raised);
        border: 1px solid var(--divider);
        border-radius: 16px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .dialog .acts {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 4px 8px;
        margin-top: 6px;
      }
      .btn-textc {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 12px;
        font: 600 calc(15px * var(--fs)) / 1.2 var(--body-font);
      }
      .cand {
        display: grid;
        grid-template-columns: calc(2.1 * 20px * var(--fs)) 1fr auto;
        column-gap: 10px;
        align-items: center;
        min-height: 56px;
        padding: 14px var(--gutter);
        border-bottom: 1px solid var(--divider);
      }
      .cand.cur {
        background: var(--accent-wash-faint);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--text-primary);
      }
      .tag .ico {
        color: var(--accent);
        width: 16px;
        height: 16px;
        stroke-width: 2.4;
      }

      /* ===== Fixed app bar (owner decision, 2026-11-20): title, season (below 1.5x), add ===== */
      .appbar {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 0 4px 0 var(--gutter);
        flex: none;
        border-bottom: 1px solid var(--divider);
      }
      .appbar .iconbtn {
        margin-left: auto;
        color: var(--accent);
      }
      [data-stack='1'] .appbar .season {
        display: none;
      }
      .season-list {
        display: none;
        padding-top: 10px;
      }
      [data-stack='1'] .season-list {
        display: block;
      }
      /* Only while there is something to say: syncing, or a failed sync with its retry. */
      .syncstrip {
        flex: none;
        padding: 6px var(--gutter);
        background: var(--surface);
        border-bottom: 1px solid var(--divider);
        color: var(--accent);
      }
      .syncstrip.errs {
        padding: 0 var(--gutter) 0 var(--gutter);
        color: var(--negative);
      }
      .listmeta {
        padding-top: 10px;
      }

      /* ===== Section screens (Collection, Upgrade) ===== */
      .progress {
        padding: 10px var(--gutter) 0;
      }
      .pbar {
        display: flex;
        height: 6px;
        border-radius: 3px;
        background: var(--fill);
        overflow: hidden;
        margin-top: 8px;
      }
      .pbar i {
        background: var(--accent);
      }
      .chiprow {
        display: flex;
        overflow: hidden;
        padding: 0 var(--gutter);
        mask-image: linear-gradient(to right, #000 88%, transparent);
        -webkit-mask-image: linear-gradient(to right, #000 88%, transparent);
      }
      .block {
        padding: 14px var(--gutter);
        border-bottom: 1px solid var(--divider);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .block .line {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
      }
      .itemline {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
      }
      .itemline .nm {
        flex: 1;
        min-width: 0;
      }
      .skill {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1.5px solid var(--text-body);
        flex: none;
      }
      .skill.on {
        background: var(--text-body);
      }
      .tagtxt {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font: 600 calc(11px * var(--fs)) / 1.2 var(--body-font);
        white-space: nowrap;
      }
      .tagtxt .ico {
        width: 14px;
        height: 14px;
        stroke-width: 2.4;
        color: var(--accent);
      }
      .filterhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 48px;
        padding: 0 var(--gutter);
        border-bottom: 1px solid var(--divider);
      }
      .fpanel {
        padding: 6px var(--gutter) 10px;
        border-bottom: 1px solid var(--divider);
        background: var(--surface);
      }
      .fpanel .sec {
        padding: 12px 0 0;
      }
      .fpanel .chips {
        flex-wrap: wrap;
        padding-top: 2px;
      }
      .selbar {
        flex: none;
        background: var(--raised);
        border-top: 1px solid var(--divider);
        padding: 10px var(--gutter) 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .selbar .acts {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .selbar .btn-primary {
        flex: 1 1 auto;
      }
      .select {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 48px;
        padding: 0 4px;
        color: var(--accent);
        font: 600 calc(13px * var(--fs)) / 1.2 var(--body-font);
      }
      .select.on {
        color: var(--text-primary);
      }
      .select .ico {
        width: 18px;
        height: 18px;
        color: var(--accent);
      }
      .offer {
        display: grid;
        grid-template-columns: 1fr auto;
        column-gap: 10px;
        align-items: center;
        padding: 10px var(--gutter);
        border-bottom: 1px solid var(--divider);
      }
      .offer.sel {
        background: var(--accent-wash-faint);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      [data-stack='1'] .offer {
        grid-template-columns: 1fr;
      }

      /* Option B (owner, 2026-11-20): from 1.5x the purchase bar keeps title + Buy; the rest moves to the review sheet. */
      [data-stack='1'] .selbar .extra {
        display: none;
      }
      .cfg {
        border-bottom: 1px solid var(--divider);
      }
      .lvl {
        padding: 12px var(--gutter) 0;
        color: var(--text-strong);
      }
      .alt {
        display: inline-block;
        margin-bottom: 4px;
        padding: 2px 8px;
        border-radius: 4px;
        background: #ffe9a8;
        color: #3a2a00;
        font: 700 11px system-ui;
      }

      /* Bottom sheets (stage 4): scrim + raised surface, header with a text Close, body scrolls. */
      .sheetwrap {
        position: absolute;
        inset: 0;
        background: var(--scrim);
        display: flex;
        align-items: flex-end;
      }
      .sheet {
        width: 100%;
        max-height: 90%;
        display: flex;
        flex-direction: column;
        background: var(--raised);
        border-top: 1px solid var(--divider);
        border-radius: 16px 16px 0 0;
      }
      .sheet .hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 4px 8px;
        padding: 8px var(--gutter) 0;
        color: var(--text-primary);
      }
      .sheet .bd {
        overflow-y: auto;
        scrollbar-width: none;
        padding: 6px var(--gutter) 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .sheet .bd > * {
        flex-shrink: 0;
      }
      .sheet .lrow {
        padding: 8px 0;
        min-height: 48px;
        border-bottom: 1px solid var(--divider);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
      }
      .sheet .lrow.on {
        border-bottom-color: var(--accent);
      }
      .sheet .ffield {
        padding: 0;
      }
    </style>
  </head>

    <h2 class="group">1 · Roster (<code>/</code>) — Arena section</h2>
    <div class="screens" id="roster-screens"></div>

    <h2 class="group">2 · Roster states</h2>
    <div class="screens" id="roster-states"></div>

    <h2 class="group">3 · Player detail (<code>/player/[id]</code>)</h2>
    <div class="screens" id="detail-screens"></div>

    <h2 class="group">4 · Player form (<code>/player/new</code>, edit, <code>/me</code> top)</h2>
    <div class="screens" id="form-screens"></div>

    <h2 class="group">5 · “Who are you?” picker</h2>
    <div class="screens" id="choice-screens"></div>

    <h2 class="group">7 · Upgrade (<code>/upgrade</code>)</h2>
    <div class="screens" id="upgrade-screens"></div>

    <h2 class="group">8 · Sheets and the planner</h2>
    <div class="screens" id="sheet-screens"></div>

    <script>
      const ic = (n, c = '') =>
        `<svg class="ico ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
      const status = `<div class="status"><span>9:41</span><span>●●● ▮</span></div>`;
      const bar = (on) => `<div class="barwrap"><div class="bottombar">
        ${[
          ['trophy', 'Arena'],
          ['grid', 'Collection'],
          ['up', 'Upgrade'],
        ]
          .map(
            ([i, l]) =>
              `<div class="tab ${on === l ? 'on' : ''}"><span class="pill-on">${ic(i)}</span><span class="t-labelsm">${l}</span></div>`,
          )
          .join('')}
      </div><div class="navbar-gap"></div></div>`;
      const fig = (cap, body, title) =>
        `<figure><div class="phone">${status}${body}</div><figcaption><b>${title}</b>${cap}</figcaption></figure>`;

      const players = [
        ['01', 'Heimdall', '3,482,119,004', '8W · 2L', 5120],
        ['02', 'Valkyrie_Eir', '3,401,877,350', '3W · 5L', 4980],
        ['03', 'Sigrun', '3,290,004,116', null, 4875],
        ['04', 'Odinson-Lars', '3,187,650,921', '6W · 0L', 4710],
        ['05', 'Brynhildr', '3,022,415,508', '1W · 1L', 4590],
        ['06', 'Ragnar the Unyielding', '2,980,331,270', '0W · 4L', 4402],
        ['07', 'Xyrerris', '2,911,004,802', 'me', 4310],
        ['08', 'Freyja', '2,860,119,433', '2W · 2L', 4220],
        ['09', 'Loki', '2,790,552,019', null, 4101],
      ];
      const rec = (r) => {
        if (!r || r === 'me') return '';
        const [w, l] = r.split(' · ');
        const wn = parseInt(w),
          ln = parseInt(l);
        return `<span class="rec"><span class="w">${wn}W</span> · <span class="${ln > wn ? 'l' : ''}">${ln}L</span></span>`;
      };
      const row = (p) => `<div class="row ${p[1] === 'Xyrerris' ? 'me' : ''}">
        <span class="rk t-rank">${p[0]}</span>
        <span class="meta"><span class="t-sub">${p[1]}</span><span class="t-num-sm">CP ${p[2]}</span></span>
        <span class="trail">${rec(p[3])}<span class="t-caption">${p[4]} pts</span></span></div>`;

      const appBar = (o = {}) =>
        `<div class="appbar"><span class="t-heading">Arena</span>${o.noSeason ? '' : '<span class="season">SEASON 14</span>'}<span class="iconbtn" aria-label="New player">${ic('plus')}</span></div>`;
      const syncStrip = `<div class="syncstrip t-caption" style="color:var(--accent)">Syncing…</div>`;
      const errStrip = `<div class="syncstrip errs"><div class="banner" style="padding-left:0;padding-right:0"><span class="t">${ic('alert')}<span class="t-caption" style="color:var(--negative)">Could not reach the server. Showing what was read last.</span></span><span class="btn-quiet">Retry</span></div></div>`;
      const header = (opts = {}) => `
        <div class="gutter"><div class="season season-list">SEASON 14</div>
        <div class="t-caption listmeta">${opts.noUpdated ? '' : 'Updated 4 minutes ago · '}${opts.count ?? '9 registered players'}</div></div>
        ${
          opts.noViewer
            ? ''
            : `<div class="viewer">
          <span class="rk t-rank" style="text-align:right">07</span>
          <span style="display:flex;flex-direction:column;gap:2px"><span class="t-labelsm" style="color:var(--text-strong)">Your avatar</span><span class="t-sub">Xyrerris</span><span class="t-caption">4310 pts</span></span>
          <span class="trail"><span class="t-num-hero">2.91B</span><span class="t-num-sm">CP 2,911,004,802</span></span></div>
        <div class="viewer-act"><span class="btn-quiet">${ic('refresh')}Update my stats</span></div>`
        }
        <div class="gutter"><div class="field">${ic('search')}${opts.query ?? 'Search players'}</div>
        <div class="chips">${['Rank', 'CP', 'My wins']
          .map(
            (c, i) =>
              `<span class="chipbox"><span class="chip ${i === 0 ? 'on' : ''}">${i === 0 ? ic('check') : ''}${c}</span></span>`,
          )
          .join('')}</div></div>`;

      document.getElementById('roster-screens').innerHTML =
        fig(
          'The title, the season (below 1.5×) and the add control are a fixed app bar. Viewer is a ladder row (rank, CP rounded + exact) with “Update my stats” as a quiet action under it. Search and sort sit together. The row keeps rank, name, exact CP, your record and points; swipe win/loss is unchanged (labels appear under the row while dragging).',
          `${appBar()}<div class="scroll">${header()}<div class="list">${players.map(row).join('')}</div></div>${bar('Arena')}`,
          'Roster — ready',
        ) +
        fig(
          'Failed sync: the message and its retry are fixed under the bar, above a list that stays usable (as today).',
          `${appBar()}${errStrip}<div class="scroll">${header()}
          <div class="list">${players.slice(0, 6).map(row).join('')}</div></div>${bar('Arena')}`,
          'Roster — sync failed',
        ) +
        fig(
          'Syncing: a thin strip under the bar reads “Syncing…” and replaces nothing; it exists only while a sync runs.',
          `${appBar()}${syncStrip}<div class="scroll">${header({ noUpdated: true })}<div class="list">${players.map(row).join('')}</div></div>${bar('Arena')}`,
          'Roster — syncing',
        );

      document.getElementById('roster-states').innerHTML =
        fig(
          'Reading the ladder. Skeleton rows keep the layout stable instead of a lone spinner.',
          `${appBar({ noSeason: true })}<div class="scroll">
          <div class="list" style="margin-top:12px">${[0, 1, 2, 3, 4]
            .map(
              () =>
                `<div class="row"><span class="skel" style="width:30px;height:20px"></span><span class="meta"><span class="skel" style="width:60%"></span><span class="skel" style="width:40%;height:11px"></span></span><span class="skel" style="width:46px"></span></div>`,
            )
            .join('')}</div>
          <div style="text-align:center;padding-top:14px" class="t-caption">Reading the ladder…</div></div>${bar('Arena')}`,
          'Roster — loading',
        ) +
        fig(
          'The whole ladder could not be read and nothing is on this device yet: ErrorState with a retry.',
          `${appBar({ noSeason: true })}<div class="scroll">
          <div class="center">${ic('alert', 'glyph neg')}<span class="t-sub">The ladder could not be read</span><span class="t-body" style="color:var(--negative);line-height:1.4">Could not reach the server.</span><span class="btn-secondary">Try again</span></div></div>${bar('Arena')}`,
          'Roster — error',
        ) +
        fig(
          'No players yet: the one filled action on the screen is “New player”.',
          `${appBar()}<div class="scroll"><div class="gutter"><div class="season season-list">SEASON 14</div><div class="t-caption listmeta">Updated 4 minutes ago · 0 registered players</div></div>
          <div class="center">${ic('users', 'glyph')}<span class="t-sub">No players yet</span><span class="t-body" style="line-height:1.45">Add the players you want to track. Everything stays on this device.</span><span class="btn-primary">${ic('plus')}New player</span></div></div>${bar('Arena')}`,
          'Roster — empty',
        ) +
        fig(
          'A search that matches nobody. No “add” action here — it would read as “create the person you were looking for”.',
          `${appBar()}<div class="scroll">${header({ noViewer: true, query: 'zzq' })}
          <div class="center" style="top:210px">${ic('search', 'glyph')}<span class="t-sub">No player by that name</span><span class="t-body" style="line-height:1.45">Nothing in the roster matches “zzq”.</span></div></div>${bar('Arena')}`,
          'Roster — search without result',
        );

      // ===== phase 2: pushed screens (no bottom bar) =====
      const topBar = (left, right = '') => `<div class="topbar">${left}<span>${right}</span></div>`;
      const back = `<span class="iconbtn">${ic('back')}</span>`;
      const pfig = (cap, body, title) => fig(cap, body, title);

      const detailHead = `<div class="gutter" style="padding-top:4px">
        <div class="t-label muted">Rank #07</div>
        <div style="font:500 calc(30px*var(--fs))/1.15 var(--display-font);margin-top:4px">Xyrerris</div>
        <div class="t-caption" style="margin-top:2px">Lv. 74 · #a984</div>
        <div style="margin-top:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
          <span class="t-labelsm muted">CP</span><span class="t-num-hero accent">2,911,004,802</span><span class="t-caption">2.91B</span></div></div>`;
      const tabs = (on) =>
        `<div class="tabs"><span class="tb ${on === 0 ? 'on' : ''}">Stats</span><span class="tb ${on === 1 ? 'on' : ''}">Vs you</span></div>`;
      const stats = [
        ['HP', '48,210,566', '48.2M'],
        ['ATK', '3,990,412', '3.99M'],
        ['DEF', '2,711,090', '2.71M'],
        ['CRIT', '11,420', '11.4K'],
        ['HIT', '9,882', '9.88K'],
        ['SPD', '1,203', '1.20K'],
      ];
      const statRow = ([k, e, s]) =>
        `<div class="stat"><span class="nm t-label muted">${k}</span><span class="ex t-num">${e}</span><span class="sh t-num-sm">${s}</span></div>`;
      const edit = `<span class="btn-quiet" style="padding-right:10px">${ic('edit')}Edit</span>`;

      const cmpRows = [
        ['HP', 62, 48, '+14.0M', false, '48.2M', '34.2M'],
        ['ATK', 40, 71, '−1.2M', true, '3.99M', '5.19M'],
        ['DEF', 55, 52, '+0.1M', false, '2.71M', '2.60M'],
      ];
      const cmp = ([k, m, t, d, opp, mv, tv]) =>
        `<div class="cmp"><div class="hd"><span class="t-label muted">${k}</span><span class="t-num-sm">${d}</span></div>
        <div class="bar"><i style="width:${m}%;background:var(--accent)"></i></div>
        <div class="bar"><i style="width:${t}%;background:var(--negative)"></i></div>
        <div class="vals"><span class="t-num-sm" style="color:var(--text-strong)">you ${mv}</span><span class="t-num-sm" style="color:var(--text-strong)">them ${tv}</span></div></div>`;
      const stepper = (lbl, n) =>
        `<div class="step"><span class="t-label muted">${lbl}</span><span class="ctl"><span class="iconbtn ${n === 0 ? 'off' : ''}">${ic('minus')}</span><span class="n t-num">${n}</span><span class="iconbtn">${ic('plus')}</span></span></div>`;

      document.getElementById('detail-screens').innerHTML =
        pfig(
          'Back and Edit become icon/quiet controls in a real top bar. Cinzel name, CP as the hero with exact and rounded side by side. Stats are one hairline list: label, exact value (left of the value block), rounded value right — the caption under the list is kept (moving it breaks `player-detail.yaml`, so it stays).',
          `${topBar(back, edit)}<div class="scroll">${detailHead}${tabs(0)}${stats.map(statRow).join('')}
          <div class="gutter t-num-sm" style="padding-top:12px">exact value left · rounded value right</div></div>`,
          'Detail — Stats',
        ) +
        pfig(
          'Head to head with the record stepper (add and remove, as today), then the stat comparison. The comparison bars keep the colour-plus-text rule: every bar has its value and delta printed.',
          `${topBar(back, edit)}<div class="scroll">${detailHead}${tabs(1)}
          <div class="h2h"><span><span class="t-labelsm muted">Head to head</span><br><span class="t-body" style="line-height:1.4">you won 3 of 5 matches</span></span><span class="rec"><span class="w">3W</span> · <span>2L</span></span></div>
          ${stepper('Wins', 3)}${stepper('Losses', 2)}${cmpRows.map(cmp).join('')}</div>`,
          'Detail — Vs you',
        ) +
        pfig(
          'No avatar yet: the Stats tab stays readable; this is a missing comparison, not a broken screen.',
          `${topBar(back, edit)}<div class="scroll">${detailHead}${tabs(1)}<div class="gutter" style="padding-top:22px"><div class="t-sub">No avatar to compare against</div><p class="t-body" style="margin-top:6px;line-height:1.5">Once the roster knows which player is yours, this tab compares the two of you stat by stat.</p></div></div>`,
          'Detail — Vs you, no avatar',
        ) +
        pfig(
          'Loading, not found and error use the shared states. Not found says what may have happened; error offers a retry.',
          `${topBar(back)}<div class="scroll"><div class="center">${ic('users', 'glyph')}<span class="t-sub">No such player</span><span class="t-body" style="line-height:1.45">This link points at someone who is not on the ladder. They may have left the season, or the link may be stale.</span><span class="btn-secondary">Back to the roster</span></div></div>`,
          'Detail — not found (loading and error as the roster states)',
        );

      // ---- form ----

          '<span class="alt">ALTERNATE — NEEDS APPROVAL (with option B)</span><br>After a read: “Find” becomes “Read again” and secondary, so the purchase bar holds the only filled action. The notices about thresholds stay next to the list (“over the ceiling, not listed”), with “Add all bargains”. The bar: title, note, Buy, Clear at 1×; from 1.5× only title + Buy + Clear (the note moves to the review sheet).',

      // ===== stage 4: sheets and the planner =====
      const under = `${sbar('Collection')}<div class="scroll">${collProgress}${utabs(['Collections', 'Items', 'Offers'], 0)}${collRow(
        7,
        [

      document.getElementById('sheet-screens').innerHTML =

          'Market sheet, listings read. Chips switch piece and carry the count (“· 3”, “· …” reading, “· !” failed, “· –” not sold); the skill mark and “needs 2” sit on the piece line. Listings are hairline rows that open the purchase card in place; at most N are shown, with the rest counted. The unlisted note closes the sheet. The listing detail line (CP, seller, lot) is composed from the strings, not re-read from `toListingUi`.',

          `${chipRow(['Valkyrie Blade +12 · skill · 3', 'Arena Cloak +9 · 1', 'Dusk Ring · –'], 0)}
          <div style="display:flex;gap:8px;align-items:center"><span class="skill on"></span><span class="t-sub">Valkyrie Blade +12 · Fire</span><span class="t-caption" style="color:var(--accent)">needs 2</span></div>
          <span class="t-body" style="color:var(--text-strong)">3 listings · from 1,200 NCG each</span>
          <span class="t-caption">Asking prices, not what was paid · 412 of this item read just now</span>
          ${lrow('1,200 NCG each', 'CP 8,420 · seller 0x12ab')}${lrow('2 for 2,500 NCG', 'CP 8,420 · seller 0x77c1')}${lrow('1,380 NCG each', 'CP 8,100 · seller 0x91fe')}
          <span class="t-caption">1 piece of this collection cannot be searched (not in the game data, or not on the market).</span>`,
          'Market sheet — listings',
        ) +
        sheetFig(
          'Market sheet states: reading with a live count, waiting for its turn, nothing on sale, not sold on the market. Each is one line; the failure has its own figure.',
          'Market · Collection 7',
          `${chipRow(['Valkyrie Blade +12 · …', 'Arena Cloak +9', 'Dusk Ring · –'], 0)}
          <div style="display:flex;gap:8px;align-items:center"><span class="skill on"></span><span class="t-sub">Valkyrie Blade +12 · Fire</span></div>
          ${msg('acc', 'Reading the market… 1,240 listings read')}
          ${msg('', 'Waiting for its turn…')}
          ${msg('', 'Nothing of this piece is on sale right now.')}
          ${msg('', 'This piece is not sold on the market.')}`,
          'Market sheet — reading, waiting, nothing',
        ) +
        sheetFig(
          'Market read failed: negative text with an icon and a secondary “Try again”. Two wordings as built (offline, other).',
          'Market · Collection 7',
          `${chipRow(['Valkyrie Blade +12 · !', 'Arena Cloak +9'], 0)}
          <div style="display:flex;gap:8px;align-items:center"><span class="skill on"></span><span class="t-sub">Valkyrie Blade +12 · Fire</span></div>
          ${msg('neg', 'Could not reach the market. Check the connection and try again.')}
          <span class="btn-secondary" style="align-self:flex-start">Try again</span>`,
          'Market sheet — failed',
        ) +
        sheetFig(
          'Offer sheet, an offer that takes several lots (a single lot opens the purchase card straight away). Name at the level it is sold at, the raise note when it is bought under target, then the lots to buy one at a time.',

          `<span class="t-body" style="color:var(--text-strong)">Valkyrie Blade +12 · Fire · needs 3</span>
          ${msg('', 'Bought at this level; raising it to +15 later costs about 320 NCG more.')}
          <span class="t-body">This takes more than one lot. Buy them one at a time:</span>

          `<span class="t-body">Valkyrie Blade +12 · Fire</span>${pcardOffer}
          ${pass}
          <span class="btn-secondary" style="align-self:flex-start">Try buying (dry run)</span>
          <span class="t-caption">A dry run: checked and signed here, and nothing is sent.</span>
          <span class="t-caption">Buying for real is not available yet. Nothing is ever sent from here.</span>${backLink}`,
          'Purchase card — dry run',
        ) +
        sheetFig(
          'Purchase card, <b style="display:inline">live mode</b>, before paying: the one filled action carries the price. Pressing it does not pay; it opens the confirmation (next figure). No passphrase is asked here.',
          'Before buying',

          <span class="btn-primary" style="align-self:flex-start">Buy for real (1,200 NCG)</span>

          ${msg('neg', 'Wrong passphrase, or the keystore was changed.')}

          'Purchase card — states',
        ) +
        sheetFig(
          'Batch sheet, before buying (live): total, the batch limit, how the order works, one line per piece, what was left out, then the one filled action with the total. Without a limit no selection can be bought and the line says where to set it.',
          'Buy the selection',
          `<span class="t-sub">3 pieces · 3,540 NCG in all</span>
          <span class="t-caption">Batch limit: 5,000 NCG</span>
          <span class="t-caption" style="line-height:1.45">Bought in groups of up to 10, in this order. Each piece is checked again, and each group is one payment that is settled before the next. If a piece was sold meanwhile, the group is split to find it.</span>
          <div class="lrow"><span class="t-body">Valkyrie Blade +12 · Fire</span></div><div class="lrow"><span class="t-body">Arena Cloak +9 · Water</span></div><div class="lrow"><span class="t-body">Iron Helm +6 · Land</span></div>
          <span class="t-caption">1 selected offer left out: only single pieces of equipment can be bought from here so far.</span>
          <span class="btn-primary" style="align-self:flex-start">Buy the selection for real (3,540 NCG)</span>`,

        sheetFig(
          'Batch confirmation, as the purchase card’s: the warning (count, total, groups of up to 10, nothing undone, the rest not bought if something fails), the passphrase, the paying button with the total, Cancel as text.',
          'Buy the selection',
          `<span class="t-sub">3 pieces · 3,540 NCG in all</span>
          ${msg('neg', 'You are about to pay 3,540 NCG for 3 pieces, in groups of up to 10. Each payment cannot be undone once it is sent. If something goes wrong the rest are not bought.')}
          ${pass}
          <span class="btn-primary" style="align-self:flex-start">Confirm and pay 3,540 NCG</span>
          <span class="btn-quiet" style="align-self:flex-start">Cancel</span>`,

        sheetFig(
          'Batch stopped: each line gains its state (bought in accent, refused with its reason in negative with an icon, not attempted in muted); the result lines say where it stopped and what was spent. Dry-run wording (“checked and signed, nothing sent”) uses the same layout.',

          <div class="lrow"><span class="t-body">Valkyrie Blade +12 · Fire</span><span class="t-caption" style="color:var(--accent)">Bought (0x3f1a2b…d4e5).</span></div>
          <div class="lrow"><span class="t-body">Arena Cloak +9 · Water</span><span class="t-caption" style="color:var(--negative)">${ic('alert')} The chain refused it, nothing was bought: insufficient balance</span></div>
          <div class="lrow"><span class="t-body">Iron Helm +6 · Land</span><span class="t-caption">not attempted</span></div>
          ${msg('neg', 'The batch stopped at Arena Cloak +9 · Water. 1 piece was not attempted.')}
          ${msg('', 'Spent so far: 1,200 NCG.')}`,

        sheetFig(
          'Batch, the other lines: preparing, wrong passphrase, no batch limit, nothing to buy, no keystore. One line each, same roles as the purchase card’s.',
          'Buy the selection',
          `${msg('', 'Checking and signing… this can take a few seconds.')}
          ${msg('neg', 'Wrong passphrase, or the keystore was changed.')}
          ${msg('neg', 'No batch limit is set, so no selection can be bought. Set one on the You tab.')}
          ${msg('', 'Nothing in the selection can be bought from here yet.')}
          ${msg('', 'Import your keystore on the You tab to try this.')}`,
          'Batch sheet — other states',
        ) +
        sheetFig(
          'Upgrade planner, choosing a piece: the sentence, slot chips, one hairline row per piece (name, Gexp, skill star, worn). The chosen row takes the accent. Copy as built.',
          'Plan an upgrade',
          `<span class="t-body">Choose the piece to raise:</span>${chipRow(['All slots', 'Weapon', 'Armor', 'Belt', 'Necklace', 'Ring'], 0)}
          <div class="lrow"><span class="t-body">Valkyrie Blade +9 · Fire · 1,240 Gexp · ★ skill · worn</span></div>
          <div class="lrow on"><span class="t-body" style="color:var(--accent)">Aegis Plate +7 · Land · 610 Gexp</span></div>
          <div class="lrow"><span class="t-body">Arena Cloak +6 · Water · 300 Gexp</span></div>`,
          'Planner — choose a piece',

        sheetFig(
          'Planner, a piece chosen: the list folds into one line with “Change”; the target level is a stepper with 48 dp − and + (disabled at the limits); the plan reads as plain lines and ends in the one filled action, which selects the pieces in the list (nothing is bought here).',
          'Plan an upgrade',
          `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="t-body" style="color:var(--accent)">Aegis Plate +7 · Land · 610 Gexp</span><span class="btn-quiet">Change</span></div>
          <div style="display:flex;align-items:center;gap:12px"><span class="btn-secondary" style="min-width:48px;justify-content:center">−</span><span class="t-sub">Target level: +9</span><span class="btn-secondary" style="min-width:48px;justify-content:center">+</span></div>
          <span class="t-caption">+7 to +9 takes 3,100 Gexp more.</span>
          <span class="t-body">2 pieces of material for 4,050 NCG.</span>
          <span class="t-caption">The upgrade itself costs 600 NCG.</span>
          <span class="t-body" style="color:var(--text-strong)">About 4,650 NCG in all.</span>
          <span class="t-caption">1 upgrade action (50 pieces at most each).</span>
          <span class="t-caption">120 Gexp would be left over.</span>
          <span class="btn-primary" style="align-self:flex-start">Select these pieces</span>`,
          'Planner — plan',
        ) +
        sheetFig(
          'Planner, the other cases: reading the bag, no avatar, the bag could not be read (with a secondary “Read again”), nothing can be raised, nothing in this slot, and a plan the offers cannot reach (“fall … short”) with the select action disabled.',
          'Plan an upgrade',
          `${msg('acc', 'Reading your bag…')}
          ${msg('neg', 'No avatar is set, so your pieces cannot be read.')}
          ${msg('neg', 'Could not reach the node to read your bag. Check the connection.')}<span class="btn-secondary" style="align-self:flex-start">Read again</span>
          ${msg('', 'No piece of grade 7 or more in your bag can be raised any further.')}
          ${msg('', 'No piece of this slot can be raised.')}
          ${msg('neg', 'The offers in range fall 900 Gexp short of this level: raise a ceiling or read grade 7.')}
          <span class="btn-primary" style="align-self:flex-start;opacity:.45">Select these pieces</span>`,
          'Planner — other states',
        );
      // Account, /me footer, boot and catalogue: next stage.

      // ===== page controls =====
      const root = document.documentElement;
      const bodyEl = document.body;
      function apply(k, v) {
        if (k === 'theme') bodyEl.dataset.theme = v;
        if (k === 'fs') {
          root.style.setProperty('--fs', v);
          bodyEl.dataset.stack = parseFloat(v) >= 1.5 ? '1' : '0';
        }
        if (k === 'w') root.style.setProperty('--w', v + 'px');
        document
          .querySelectorAll(`.toolbar button[data-k="${k}"]`)
          .forEach((b) => b.classList.toggle('on', b.dataset.v === v));
      }
      document
        .querySelectorAll('.toolbar button')
        .forEach((b) => b.addEventListener('click', () => apply(b.dataset.k, b.dataset.v)));
      const q = new URLSearchParams(location.search);
      for (const k of ['theme', 'fs', 'w']) if (q.get(k)) apply(k, q.get(k));
      (() => {
        const need = [
          '400 14px Barlow',
          '600 14px Barlow',
          '700 14px Barlow',
          '700 14px Cinzel',
          '500 14px Cinzel',
          '400 14px JetBrainsMono',
          '500 14px JetBrainsMono',
        ];
        // `check` is false for a face nothing has asked for yet, so request every one first.
        Promise.all(need.map((f) => document.fonts.load(f)))
          .then(() => need.every((f) => document.fonts.check(f)))
          .catch(() => false)
          .then((ok) => {
            document.getElementById('fontcheck').textContent = ok
              ? 'fonts: bundled files loaded'
              : 'fonts: FALLBACK in use';
            window.__fontsOk = ok;
          });
      })();
    </script>
  </body>
